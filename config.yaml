# Ra'ij pipeline configuration. Secrets live in .env, never here.

brands:
  - id: raij
    name: "رائج"
    language: ar
    # Phase 18 (owner 2026-09-24): professional Standard Arabic only — no dialect touch anywhere (replaces D3).
    tone: "professional Modern Standard Arabic (الفصحى), pan-Arab news-channel register, warm, clear and curious"
    voice:
      name: ar-JO-TaimNeural       # Phase 18 bench (script 43): Taim 94.5 % words read right, Shakir 94.4, Hamed 93.6, Laith 90.7
      alt: ar-EG-ShakirNeural      # used by the review bot's 🎙 Re-voice button
      rate: "+10%"                 # Shorts pacing; Arabic neural voices speak ~1.85 words/s at +0%
      pitch: "+0Hz"
    subtitle_font: "Cairo Black"   # assets/fonts/Cairo-Variable.ttf, shaped by raqm
    # Series badge shown with the hook title and on the end card, by story category. The script
    # LLM may pick another name from this list when it fits better.
    series:
      tech: "عالم التقنية"
      money: "أرقام تهمك"
      wow-facts: "هل تعلم؟"
      life-hack: "حيلة اليوم"
      tools: "أداة اليوم"          # apps, gadgets, AI tools — affiliate slot arrives in Phase 14 (D4)
      sports: "رياضة في دقيقة"
      culture: "حكايات"
      news-lite: "رائج اليوم"
    # Closing line: spoken CTA spirit for the script prompt and the end-card text, rotated per video
    # (Phase 12). Keyed by series name; "default" covers the rest.
    cta:
      default:
        - "تابعنا للمزيد"
        - "شاركها مع صديق يهمه الموضوع"
        - "اكتب رأيك في التعليقات"
      "عالم التقنية":
        - "تابعنا لتعرف الجديد قبل الجميع"
        - "شاركها مع صديق يحب التقنية"
      "أرقام تهمك":
        - "احفظها وارجع لها لاحقا"
        - "شاركها مع صديق يهتم بالفلوس"
      "هل تعلم؟":
        - "شاركها مع شخص لا يعرفها"
        - "تابعنا لمعلومة جديدة كل يوم"
      "حيلة اليوم":
        - "جربها وقل لنا النتيجة"
        - "احفظها قبل أن تنساها"
      "أداة اليوم":
        - "الرابط في الوصف"
        - "جربها وقل لنا رأيك"
    platforms: [instagram, facebook, youtube, tiktok, tiktok_export]   # tiktok = app inbox/direct; export = Telegram copy until it's connected

discovery:
  regions: [SA, AE, EG, SD]
  youtube:
    enabled: true
    # Units/day for discovery. The project's 10,000/day is shared with Shorts uploads
    # (~1,600 each), so leave room for 3 uploads. Default plan costs ~1,620/day.
    daily_quota_budget: 5000
    trending_per_region: 50        # chart=mostPopular, 1 unit per region
    shorts_queries: ["اكتشاف", "حقائق", "tech news", "life hack"]
    results_per_query: 25          # search.list = 100 units per query per region
    shorts_lookback_hours: 48
  reddit:
    enabled: true
    subreddits: [todayilearned, technology, worldnews, LifeProTips, sports]
    limit_per_sub: 25
  trends:
    enabled: true
    geos: [SA, AE, KW, EG]         # Gulf-first (Phase 12); no SD feed (HTTP 400); US dropped (NFL roster noise)
  wikipedia:
    enabled: true                  # yesterday's most-viewed Arabic Wikipedia articles (keyless, Wikimedia REST)
    lang: ar
    top: 40
  rss:
    enabled: true
    max_items_per_feed: 20
    # Plain URLs or {url, region, name}. Examples:
    #   - {url: "https://feeds.bbci.co.uk/arabic/rss.xml", region: SD, name: "BBC Arabic"}
    #   - https://www.youtube.com/feeds/videos.xml?channel_id=<CHANNEL_ID>
    # Keyless defaults so discovery works before any API keys are set. Phase 12 set: Gulf Arabic news,
    # money and tech first, then English tech/tools/science/life-hack sources for the niche (all verified
    # 2026-09-23; Al Arabiya, Argaam, CNBC Arabia, Maaal block bots or have no feed; Arab News answers httpx
    # with a Cloudflare challenge). Region AR = pan-Arab.
    feeds:
      - {url: "https://www.skynewsarabia.com/rss", region: SA, name: "Sky News Arabia"}
      - {url: "https://www.skynewsarabia.com/web/rss/technology.xml", region: SA, name: "Sky News Arabia Tech"}
      - {url: "https://www.skynewsarabia.com/web/rss/business.xml", region: SA, name: "Sky News Arabia Business"}
      - {url: "https://aawsat.com/feed/economy", region: SA, name: "Asharq Al-Awsat Economy"}
      - {url: "https://aitnews.com/feed/", region: SA, name: "AIT News"}
      - {url: "https://feeds.bbci.co.uk/arabic/science_and_tech/rss.xml", region: AR, name: "BBC Arabic Science & Tech"}
      - {url: "https://techcrunch.com/feed/", region: US, name: "TechCrunch"}
      - {url: "https://www.theverge.com/rss/index.xml", region: US, name: "The Verge"}
      - {url: "https://www.technologyreview.com/feed/", region: US, name: "MIT Technology Review"}
      - {url: "https://www.sciencedaily.com/rss/top/science.xml", region: US, name: "ScienceDaily"}
      - {url: "https://www.livescience.com/feeds/all", region: US, name: "Live Science"}
      - {url: "https://lifehacker.com/feed/rss", region: US, name: "Lifehacker"}
      - {url: "https://www.makeuseof.com/feed/", region: US, name: "MakeUseOf"}

ranking:
  weights: { view_velocity: 0.5, engagement: 0.3, recency: 0.2 }
  top_n: 8                         # automatic daily Shorts picks (owner's picks via the bot come on top)
  long_top_n: 1                    # of those, how many also get a long (2–5 min) version: best evergreen/explainer
  shortlist: 12                    # items the bot's /trending list offers for picking
  window_hours: 48                 # only candidates seen this recently are ranked
  classify_pool: 45                # unchecked items sent to the LLM per run, round-robin across sources (Phase 12)
  batch_size: 15                   # items per LLM call
  max_per_category: 2              # keep the daily picks varied
  # Phase 12 niche (owner's call, D1): only these categories are ever selected …
  categories: [tech, money, wow-facts, life-hack, tools]
  # … these are still recognised by the screen so the model has an honest label; they're kept as `ranked`
  # but never picked.
  other_categories: [news-lite, sports, culture]
  flagged_categories: [political]  # never auto-scheduled
  winner_boost: 0.15               # score ×1.15 for categories of last week's best videos (0 = off)
  # Who the screen judges audience_fit for (Phase 12, D2).
  audience: "Arabic-speaking viewers in Saudi Arabia and the Gulf (also Egypt and Sudan): curious, mobile-first, 18–35"
  # Selection multipliers (Phase 12): score × category × region × fit × evergreen × winner boost.
  category_weights: { tech: 1.0, money: 1.0, wow-facts: 1.05, life-hack: 1.05, tools: 1.0 }
  region_weights: { SA: 1.0, AE: 1.0, KW: 0.95, QA: 0.95, BH: 0.95, OM: 0.95, AR: 0.95, EG: 0.85, SD: 0.8, US: 0.75 }
  region_default_weight: 0.75
  fit_weight: 0.15                 # × (1 + fit_weight × (audience_fit − 3)): fit 5 → ×1.3, fit 1 → ×0.7
  evergreen_bonus: 0.1             # × 1.1 for evergreen items (helps the starved wow-facts / life-hack series)

extract:
  max_articles: 3                  # trends: read up to this many linked news articles
  long_articles: 6                 # when a long video is wanted, read up to this many (Google News search adds more)
  min_article_chars: 400           # shorter extracted page text counts as unreadable
  min_source_chars: 120            # below this there's no story to distill → extract_failed
  max_prompt_chars: 12000          # source text sent to the LLM
  max_transcript_chars: 20000      # source text kept for the Phase 4 similarity gate
  whisper_model: small             # faster-whisper, CPU int8; only when a video has no subtitles
  whisper_max_seconds: 900

# Formats (Phase 13/15, src/formats.py). `short` is the classic vertical Short; `long` is a landscape 2–5 min
# YouTube video with chapters (vertical videos ≤3 min are filed as Shorts by YouTube, hence 16:9).
# The legacy script.*/voice.*/video.* keys below still define `short`; anything here overrides.
formats:
  long:
    width: 1920
    height: 1080
    max_seconds: 300
    voice_max_seconds: 290
    voice_min_seconds: 100
    min_words: 240                 # ≈ 2.2 min at +0%
    max_words: 520                 # ≈ 4.7 min at +0% (1.85 words/s)
    voice_rate: "+0%"              # calmer pacing than the Shorts' +10%
    cut_every: 8
    hook_title_seconds: 3.0

script:
  # Brief said 110–150, but measured Arabic TTS (~2.05 words/s at +10%) makes 150 words ≈ 73s.
  # 85–115 words ≈ 41–56s, inside voice.max_seconds. The model is asked for min+10..max-10.
  min_words: 85
  max_words: 115
  similarity_threshold: 0.35       # above this vs source transcript → rewrite once, else reject
  max_shared_run: 8                # this many consecutive non-number words copied from the source → same (A5)
  polish: true                     # Phase 18: editor pass → professional فصحى + fully vocalized TTS text (1 LLM call)

voice:
  target_lufs: -14
  max_seconds: 58                  # leaves ~2s of video.max_seconds for the brand end-card
  min_seconds: 40                  # shorter is kept, with a warning

video:
  width: 1080
  height: 1920
  max_seconds: 60
  fps: 30
  endcard_seconds: 2.0
  transition_seconds: 0.3          # xfade overlap per cut (0 = hard cuts)
  hook_title_seconds: 2.5          # on-screen hook title at the start; subtitles begin after it
  progress_bar: true               # thin yellow bar across the top
  stock_keep_days: 14              # cached stock clips unused this long are deleted after a render
  faceless: true                   # skip stock clips whose previews show a face (public figures get a licensed photo)

pipeline:
  max_age_days: 2                  # a pick still not reviewed after this is expired (stale trend, saves quota)
  max_attempts: 3                  # retryable failures per item (extract, script, voice, assemble) before it fails
                                   # (an outage — LLM/edge-tts/stock unreachable or out of quota — never counts)
  catch_up_hours: 2                # the 30-min publish job finishes leftovers of an interrupted daily run this
                                   # often (0 = never; 2026-09-24 a sleeping Mac cost 5 of 8 picks until next day)

publish:
  max_attempts: 3                  # per (video, platform), across runs; then a Telegram alert
  retry_after_hours: [1, 6, 24]    # backoff from the last failed attempt (A8); ticks in between skip it
  every_minutes: 30                # launchd publish job interval (install-services)
  max_age_hours: 72                # approvals older than this aren't published (trends go stale)
  # Posting windows (Phase 12): a video's first upload happens only inside a window, one video per window,
  # oldest approval first. A video already partly out finishes its other platforms whenever they're due.
  # `times: []` = publish as soon as approved (pre-12 behaviour).
  windows:
    timezone: Asia/Riyadh          # Gulf-first (D2)
    times: []                      # owner 2026-09-24: "no limits" — approved videos post on the next pass.
                                   # Windows were ["08:00", "13:00", "18:00", "21:00"]; restore to pace uploads.
    open_minutes: 150              # a window accepts videos this long after its start
    per_window: 1                  # videos a window may start (4 windows × 1 = 4 videos/day; /post_now skips windows)
  youtube_privacy: public          # public | unlisted | private
  # Platforms that take a `long` video (Reels/Shorts APIs cap at 60–90 s); TikTok is a file export anyway.
  long_platforms: [youtube, tiktok, tiktok_export]
  # TikTok Content Posting API (SETUP.md §8). mode: inbox = upload to the owner's TikTok inbox, they paste the
  # caption and post from the app (works before TikTok's audit); direct = post straight to the profile
  # (needs the audited app + scope video.publish; before that TikTok forces SELF_ONLY, so direct refuses).
  tiktok:
    mode: inbox
    # Web platform (the portal insists on https): TikTok sends the code to this page on our site, which shows the
    # `tiktok-auth --code … --state …` command to run. Leave empty to use the Desktop loopback below instead.
    redirect_uri: ""               # empty → Desktop loopback below (the sandbox app only accepts 127.0.0.1:<port>)
    redirect_port: 8471            # Desktop platform: http://127.0.0.1:8471/callback/
    scopes: [user.info.basic, video.upload]
    chunk_mb: 10
    privacy: PUBLIC_TO_EVERYONE    # direct mode only; must be among the creator-info options
    is_aigc: true                  # direct mode: the AI-generated label (voice + script are generated)
  youtube_thumbnails: true         # long videos: upload the generated thumbnail (50 quota units)
  youtube_playlists: true          # add each Short to a playlist named after its series (needs the `youtube` scope)
  # SEO (Phase 12): fixed niche tags merged into every post's tags/hashtags, by story category.
  seo_tags:
    tech: ["تقنية", "ذكاء_اصطناعي", "تكنولوجيا", "tech", "AI"]
    money: ["اقتصاد", "مال", "أعمال", "استثمار", "business"]
    wow-facts: ["هل_تعلم", "معلومات", "حقائق", "علوم", "facts"]
    life-hack: ["حيل", "نصائح", "حيلة", "lifehack", "tips"]
    tools: ["أدوات", "تطبيقات", "ذكاء_اصطناعي", "apps", "AItools"]
    default: ["رائج", "شورتس", "السعودية", "الخليج", "Shorts"]
  meta_graph_version: v25.0        # Graph API version for IG/FB Reels
  poll_seconds: 5                  # Instagram container processing poll
  poll_timeout_seconds: 600

llm:
  fallback_order: [gemini, groq, ollama]
  # Tried after GEMINI_MODEL (.env) when it is out of free quota, overloaded, or retired. Quotas
  # are per model (gemini-flash-latest: 20 requests/day), so full flash models come before lite —
  # lite writes noticeably weaker Arabic (typos, stray non-Arabic characters).
  gemini_fallback_models: [gemini-3.7-flash, gemini-3.6-flash, gemini-3.5-flash, gemini-3-flash-preview,
                           gemini-flash-lite-latest, gemma-4-31b-it]
  overload_cooldown_seconds: 300   # a model that answered 503 "high demand" rests this long before it's asked again
                                   # (re-asking five overloaded models cost ~25 s per call live, 2026-09-24)

schedule:
  run_daily_at: "10:30"            # local time; launchd job com.raij.daily (install-services). Phase 18: moved from
                                   # 07:00 — Gemini's free quotas reset at 07:00 UTC = 10:00 Cairo; at 07:00 the strong
                                   # models were still exhausted from the day before and weak fallbacks wrote dialect.
  timezone: Africa/Cairo           # server (systemd) timer runs at run_daily_at in this zone
  keep_awake: true                 # Mac: pipeline commands hold `caffeinate -i -s` while they run (src/power.py);
                                   # the 10:30 run of 2026-09-24 slept with the Mac from 10:33 to 14:21

analytics:
  track_days: 30                   # keep pulling metrics for posts this recent
  report_days: 7                   # weekly report window
  report_weekday: 0                # 0 = Monday; sent once per ISO week by the daily run (or /report)
