# Ra'ij on GitHub Actions ($0, no server). Every ~10 min: restore the encrypted state, run one `tick`
# (daily pipeline when due at 07:00 Cairo, Telegram taps, publishing), save the state if it changed.
# Master switch: repository variable RAIJ_ENABLED=true. Secrets: RAIJ_ENV (.env contents),
# RAIJ_STATE_KEY, RAIJ_YOUTUBE_TOKEN, RAIJ_CLIENT_SECRET. See SETUP.md "GitHub Actions".
# GitHub's own schedule fires only every 2–3 h on this repo, so a Cloudflare Worker (deploy/cloudflare-trigger)
# dispatches the workflow every 10 min; the schedule below stays as a fallback.
#
# Hardening (audit S1): actions pinned to commit SHAs (a moved tag can't run new code here); the checkout
# keeps no git credentials; the repo token and the state key reach only the steps that need them — the
# pipeline itself (which reads untrusted web pages) runs with neither; keys land on disk only after the cache
# restore and are removed before the cache save.
name: raij

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "Ra'ij command to run on the live state (default: tick). E.g. finalize, publish --dry-run"
        default: tick
        required: false
      export_state:
        description: "Also refresh the state-bootstrap release now (to move the state to another machine)"
        type: boolean
        default: false
        required: false

permissions:
  contents: write        # keep-alive commit (GitHub pauses schedules after 60 idle days), bootstrap release
  actions: write         # prune old state caches

concurrency:
  group: raij-state      # one run at a time: they share one state
  cancel-in-progress: false

jobs:
  tick:
    if: vars.RAIJ_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
        with:
          enable-cache: true

      - name: System packages (ffmpeg, Arabic shaping)
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends ffmpeg libfribidi0 libraqm0

      - name: Python deps
        run: |
          uv sync --frozen --no-dev
          uv run python -c "from src import textshape; assert textshape.ensure(), 'Arabic shaping (raqm) unavailable'"

      - name: Restore state (cache)
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: state.enc
          key: raij-state-${{ github.run_id }}
          restore-keys: raij-state-

      - name: Fetch the bootstrap state (no cache)
        if: hashFiles('state.enc') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "No cached state — trying the one-time bootstrap release"
          gh release download state-bootstrap --pattern state.enc || {
            echo "::error::No state found. Refusing to start from an empty database (it would re-post everything)."; exit 1; }

      - name: Unpack state
        id: unpack
        env:
          RAIJ_STATE_KEY: ${{ secrets.RAIJ_STATE_KEY }}
        run: uv run python -m src.main state unpack state.enc

      - name: Keys
        env:
          RAIJ_ENV: ${{ secrets.RAIJ_ENV }}
          RAIJ_YOUTUBE_TOKEN: ${{ secrets.RAIJ_YOUTUBE_TOKEN }}
          RAIJ_CLIENT_SECRET: ${{ secrets.RAIJ_CLIENT_SECRET }}
        run: |
          umask 077
          mkdir -p data
          printf '%s\n' "$RAIJ_ENV" > .env
          [ -n "$RAIJ_CLIENT_SECRET" ] && printf '%s' "$RAIJ_CLIENT_SECRET" > client_secret.json
          [ -n "$RAIJ_YOUTUBE_TOKEN" ] && printf '%s' "$RAIJ_YOUTUBE_TOKEN" > data/youtube.token.json
          true

      - name: Tick
        id: tick
        timeout-minutes: 150          # leaves the job time to pack + save even when the pipeline hangs
        env:
          RAIJ_COMMAND: ${{ inputs.command || 'tick' }}
          RAIJ_STATE_KEY: ${{ secrets.RAIJ_STATE_KEY }}   # weekly encrypted DB backup to Telegram
        run: |
          # shellcheck disable=SC2086  # the command may carry flags ("publish --dry-run"): word-split on purpose
          uv run python -m src.main $RAIJ_COMMAND

      - name: Remove keys from disk
        if: always()
        run: rm -f .env client_secret.json data/youtube.token.json

      - name: Pack state
        id: pack
        if: always() && steps.unpack.outcome == 'success'
        env:
          RAIJ_STATE_KEY: ${{ secrets.RAIJ_STATE_KEY }}
        run: |
          # A tick that failed or was killed may have changed the DB without touching data/.changed:
          # save anyway, or the next tick replays the day (daily pipeline, cards, quota).
          if [ -f data/.changed ] || [ "${{ steps.tick.outcome }}" != "success" ] || [ "${{ inputs.export_state }}" = "true" ]; then
            uv run python -m src.main state pack state.enc
            echo "save=true" >> "$GITHUB_OUTPUT"
          else
            echo "State unchanged — not saving"
          fi

      - name: Save state (cache)
        if: always() && steps.pack.outputs.save == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: state.enc
          key: raij-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prune old state caches (keep 3)
        if: always() && steps.pack.outputs.save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key raij-state- --sort created_at --order desc --limit 50 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - name: Refresh the bootstrap release (weekly)
        # The fallback when the cache is gone (evicted after 7 idle days, or the 10 GB limit). Kept fresh so a
        # fallback doesn't replay week-old Telegram taps or re-upload videos. Encrypted, so a public asset is fine.
        if: always() && steps.pack.outputs.save == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view state-bootstrap >/dev/null 2>&1; then
            gh release create state-bootstrap --title "State bootstrap" --latest=false \
              --notes "Encrypted pipeline state (AES-256, RAIJ_STATE_KEY). Fallback for the Actions cache; refreshed weekly by the workflow."
          fi
          updated=$(gh release view state-bootstrap --json assets --jq '.assets[] | select(.name == "state.enc") | .updatedAt' || true)
          age=$(( $(date +%s) - $(date -d "${updated:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$age" -gt $(( 7 * 86400 )) ] || [ "${{ inputs.export_state }}" = "true" ]; then
            gh release upload state-bootstrap state.enc --clobber && echo "Bootstrap release refreshed"
          else
            echo "Bootstrap release is $(( age / 3600 )) h old — fine"
          fi

      - name: Keep-alive commit (every ~45 days)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "raij-bot"; git config user.email "raij-bot@users.noreply.github.com"
            git commit --allow-empty -m "keep-alive (scheduled workflows pause after 60 idle days)"
            # The checkout kept no credentials (persist-credentials: false): authenticate this one push only.
            auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:main
          fi
