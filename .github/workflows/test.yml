# Tests on every push, on the same runner image the pipeline uses — includes a real ffmpeg render
# (xfade, overlays, Arabic subtitles), so ffmpeg/raqm differences show up here, not in the 07:00 run.
# Actions pinned to commit SHAs (audit S1); no secrets are available to this workflow.
name: test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e   # v6.8.0
        with:
          enable-cache: true
      - run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends ffmpeg libfribidi0 libraqm0
      - run: uv sync --frozen
      - run: uv run pytest -q
