[project]
name = "raij"
version = "0.1.0"
description = "Ra'ij — trend-to-Arabic-shorts engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
    "trafilatura>=2.2.0",
    "edge-tts>=7.2.8",
    "pillow>=12.3.0",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = ["pytest>=8.0"]
# Speech-to-text fallback for YouTube videos without subtitles: uv sync --group whisper
whisper = ["faster-whisper>=1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
