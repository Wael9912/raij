[project]
name = "raij"
version = "0.1.0"
description = "Ra'ij — trend-to-Arabic-shorts engine"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "feedparser>=6.0.14",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
